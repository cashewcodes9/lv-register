# Services and profiles from PLAN.md section 6.1.
#   core           long-running stores: lake (SeaweedFS S3), postgres. `api` joins in Milestone 8.
#   orchestration  Dagster: dagster-code, dagster-webserver (:3000), dagster-daemon.
#   tools          one-shot containers started with `docker compose run`: build, cli, dbt, duckdb.
# The dev profile (web-dev) joins in Milestone 9.
name: lv-register

x-env: &env
  env_file:
    - path: .env
      required: false

services:
  lake:
    profiles: ["core"]
    image: chrislusf/seaweedfs:4.51
    command:
      - server
      - -dir=/data
      - -ip=lake
      - -ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=1024
      - -volume.max=0
      - -filer
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - lake-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:8333:8333"   # S3 API
      - "127.0.0.1:8888:8888"   # filer file browser
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  lake-init:
    profiles: ["core"]
    image: chrislusf/seaweedfs:4.51
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    volumes:
      - ./docker/seaweedfs/init-buckets.sh:/init-buckets.sh:ro
    depends_on:
      lake:
        condition: service_healthy
    restart: "no"

  # One instance, two databases: lv_serving (serving store) and dagster (Milestone 7).
  # The init script runs only on the first start with an empty volume.
  postgres:
    profiles: ["core"]
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-local-only}
      SERVING_DB_PASSWORD: ${SERVING_DB_PASSWORD:-lv-serving-local-only}
      DAGSTER_DB_PASSWORD: ${DAGSTER_DB_PASSWORD:-dagster-local-only}
    volumes:
      - pg-data:/var/lib/postgresql
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lv_serving -q"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  build:
    profiles: ["tools"]
    build:
      context: docker/builder
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: lv-register/build:dev
    volumes:
      - .:/work
      - gradle-cache:/home/builder/.gradle
      # Testcontainers starts sibling containers through the host's Docker daemon and reaches
      # their mapped ports through the host gateway.
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      # Optional: RealCaptureCheck normalizes this capture from the compose lake.
      LV_REAL_CAPTURE_DATE: ${LV_REAL_CAPTURE_DATE:-}
      LV_TEST_HEAP: ${LV_TEST_HEAP:-512m}
      # Optional: DbtFixturesTest rewrites transform/fixtures/lake when set to 1.
      LV_WRITE_DBT_FIXTURES: ${LV_WRITE_DBT_FIXTURES:-}
      DUCKDB_MEMORY_LIMIT: ${DUCKDB_MEMORY_LIMIT:-1GB}

  cli:
    profiles: ["tools"]
    build:
      context: .
      target: cli
    image: lv-register/cli:dev
    <<: *env
    # Defaults, so the CLI works without a .env file; .env values win through interpolation.
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://lake:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lvdev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-lvdev-local-only-secret}
      S3_BUCKET_RAW: ${S3_BUCKET_RAW:-lv-raw}
      S3_BUCKET_LAKE: ${S3_BUCKET_LAKE:-lv-lake}
      S3_BUCKET_MARTS: ${S3_BUCKET_MARTS:-lv-marts}
      DUCKDB_MEMORY_LIMIT: ${DUCKDB_MEMORY_LIMIT:-1GB}
      SERVING_BACKEND: ${SERVING_BACKEND:-postgres}
      SERVING_JDBC_URL: ${SERVING_JDBC_URL:-jdbc:postgresql://postgres:5432/lv_serving}
      SERVING_DB_USER: ${SERVING_DB_USER:-lv_serving}
      SERVING_DB_PASSWORD: ${SERVING_DB_PASSWORD:-lv-serving-local-only}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # diff holds two full snapshots in memory; serial GC suits the 1 CPU VM.
      JAVA_OPTS: ${CLI_JAVA_OPTS:--Xmx2g -XX:+UseSerialGC}
    depends_on:
      lake-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # dbt over the lake (Milestone 6), with ./transform mounted for development. The image also
  # holds Dagster and a copy of the dbt project for the orchestration services.
  dbt:
    profiles: ["tools"]
    build: &orchestration-build
      context: .
      dockerfile: orchestration/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: lv-register/orchestration:dev
    <<: *env
    entrypoint: ["dbt"]
    environment:
      DBT_TARGET: ${DBT_TARGET:-lake}
      DBT_PROFILES_DIR: /work/transform
      DBT_TARGET_PATH: /tmp/dbt/target
      DBT_LOG_PATH: /tmp/dbt/logs
      S3_ENDPOINT: ${S3_ENDPOINT:-http://lake:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lvdev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-lvdev-local-only-secret}
      S3_BUCKET_MARTS: ${S3_BUCKET_MARTS:-lv-marts}
      LV_LAKE_ROOT: ${LV_LAKE_ROOT:-s3://lv-lake}
      DUCKDB_MEMORY_LIMIT: ${DUCKDB_MEMORY_LIMIT:-1GB}
    volumes:
      - ./transform:/work/transform
    depends_on:
      lake-init:
        condition: service_completed_successfully

  # Dagster (Milestone 7): code server, UI and daemon from the orchestration image, storage in
  # the `dagster` database. Runs execute in dagster-code, which starts the cli containers of
  # the Java steps through the Docker socket (Dagster Pipes).
  dagster-code:
    profiles: ["orchestration"]
    build: *orchestration-build
    image: lv-register/orchestration:dev
    <<: *env
    command: ["dagster", "api", "grpc", "-h", "0.0.0.0", "-p", "4000", "-m", "lvregister_orchestration.definitions"]
    environment: &dagster-env
      DAGSTER_DB_PASSWORD: ${DAGSTER_DB_PASSWORD:-dagster-local-only}
      DAGSTER_RUN_RETENTION_DAYS: ${DAGSTER_RUN_RETENTION_DAYS:-90}
      LV_CAPTURE_CRON: ${LV_CAPTURE_CRON:-0 6 * * 1}
      LV_ALERT_WEBHOOK_URL: ${LV_ALERT_WEBHOOK_URL:-}
      LV_CLI_IMAGE: lv-register/cli:dev
      LV_DOCKER_NETWORK: lv-register_default
      CLI_JAVA_OPTS: ${CLI_JAVA_OPTS:--Xmx2g -XX:+UseSerialGC}
      # Passed on to the cli containers (FORWARDED_ENV in java_assets.py); dbt reads them too.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://lake:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lvdev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-lvdev-local-only-secret}
      S3_BUCKET_RAW: ${S3_BUCKET_RAW:-lv-raw}
      S3_BUCKET_LAKE: ${S3_BUCKET_LAKE:-lv-lake}
      S3_BUCKET_MARTS: ${S3_BUCKET_MARTS:-lv-marts}
      SERVING_BACKEND: ${SERVING_BACKEND:-postgres}
      SERVING_JDBC_URL: ${SERVING_JDBC_URL:-jdbc:postgresql://postgres:5432/lv_serving}
      SERVING_DB_USER: ${SERVING_DB_USER:-lv_serving}
      SERVING_DB_PASSWORD: ${SERVING_DB_PASSWORD:-lv-serving-local-only}
      DUCKDB_MEMORY_LIMIT: ${DUCKDB_MEMORY_LIMIT:-1GB}
      DBT_TARGET: lake
      DBT_TARGET_PATH: /tmp/dbt/target
      DBT_LOG_PATH: /tmp/dbt/logs
      LV_LAKE_ROOT: s3://${S3_BUCKET_LAKE:-lv-lake}
    volumes:
      - dagster-storage:/opt/dagster/storage
      - ./docker/dagster/dagster.yaml:/opt/dagster/home/dagster.yaml:ro
      - ./docker/dagster/workspace.yaml:/opt/dagster/home/workspace.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"
    healthcheck:
      test: ["CMD", "dagster", "api", "grpc-health-check", "-p", "4000"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      lake-init:
        condition: service_completed_successfully
    restart: unless-stopped

  dagster-webserver:
    profiles: ["orchestration"]
    image: lv-register/orchestration:dev
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/opt/dagster/home/workspace.yaml"]
    environment:
      DAGSTER_DB_PASSWORD: ${DAGSTER_DB_PASSWORD:-dagster-local-only}
    volumes:
      - dagster-storage:/opt/dagster/storage
      - ./docker/dagster/dagster.yaml:/opt/dagster/home/dagster.yaml:ro
      - ./docker/dagster/workspace.yaml:/opt/dagster/home/workspace.yaml:ro
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/server_info', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      dagster-code:
        condition: service_healthy
    restart: unless-stopped

  dagster-daemon:
    profiles: ["orchestration"]
    image: lv-register/orchestration:dev
    command: ["dagster-daemon", "run", "-w", "/opt/dagster/home/workspace.yaml"]
    environment:
      DAGSTER_DB_PASSWORD: ${DAGSTER_DB_PASSWORD:-dagster-local-only}
    volumes:
      - dagster-storage:/opt/dagster/storage
      - ./docker/dagster/dagster.yaml:/opt/dagster/home/dagster.yaml:ro
      - ./docker/dagster/workspace.yaml:/opt/dagster/home/workspace.yaml:ro
    healthcheck:
      test: ["CMD", "dagster-daemon", "liveness-check"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 90s
    depends_on:
      dagster-code:
        condition: service_healthy
    restart: unless-stopped

  duckdb:
    profiles: ["tools"]
    build:
      context: docker/duckdb
    image: lv-register/duckdb:1.4.5
    <<: *env
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /work
    volumes:
      - ./data:/work/data
      - ./scripts:/work/scripts:ro
    stdin_open: true
    tty: true

volumes:
  lake-data:
  pg-data:
  gradle-cache:
  dagster-storage:
