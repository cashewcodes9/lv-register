# Services and profiles from PLAN.md section 6.1.
#   core   long-running stores: lake (SeaweedFS S3), postgres. `api` joins in Milestone 8.
#   tools  one-shot containers started with `docker compose run`: build, cli, duckdb.
# The orchestration (Dagster) and dev (web-dev) profiles join in later milestones.
name: lv-register

x-env: &env
  env_file:
    - path: .env
      required: false

services:
  lake:
    profiles: ["core"]
    image: chrislusf/seaweedfs:4.51
    command:
      - server
      - -dir=/data
      - -ip=lake
      - -ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=1024
      - -volume.max=0
      - -filer
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - lake-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:8333:8333"   # S3 API
      - "127.0.0.1:8888:8888"   # filer file browser
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  lake-init:
    profiles: ["core"]
    image: chrislusf/seaweedfs:4.51
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    volumes:
      - ./docker/seaweedfs/init-buckets.sh:/init-buckets.sh:ro
    depends_on:
      lake:
        condition: service_healthy
    restart: "no"

  # One instance, two databases: lv_serving (serving store) and dagster (Milestone 7).
  # The init script runs only on the first start with an empty volume.
  postgres:
    profiles: ["core"]
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-local-only}
      SERVING_DB_PASSWORD: ${SERVING_DB_PASSWORD:-lv-serving-local-only}
      DAGSTER_DB_PASSWORD: ${DAGSTER_DB_PASSWORD:-dagster-local-only}
    volumes:
      - pg-data:/var/lib/postgresql
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lv_serving -q"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  build:
    profiles: ["tools"]
    build:
      context: docker/builder
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: lv-register/build:dev
    volumes:
      - .:/work
      - gradle-cache:/home/builder/.gradle
      # Testcontainers starts sibling containers through the host's Docker daemon and reaches
      # their mapped ports through the host gateway.
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal

  cli:
    profiles: ["tools"]
    build:
      context: .
      target: cli
    image: lv-register/cli:dev
    <<: *env
    # Defaults, so the CLI works without a .env file; .env values win through interpolation.
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://lake:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lvdev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-lvdev-local-only-secret}
      S3_BUCKET_RAW: ${S3_BUCKET_RAW:-lv-raw}
      S3_BUCKET_LAKE: ${S3_BUCKET_LAKE:-lv-lake}
      DUCKDB_MEMORY_LIMIT: ${DUCKDB_MEMORY_LIMIT:-1GB}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      lake-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  duckdb:
    profiles: ["tools"]
    build:
      context: docker/duckdb
    image: lv-register/duckdb:1.4.5
    <<: *env
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /work
    volumes:
      - ./data:/work/data
      - ./scripts:/work/scripts:ro
    stdin_open: true
    tty: true

volumes:
  lake-data:
  pg-data:
  gradle-cache:
